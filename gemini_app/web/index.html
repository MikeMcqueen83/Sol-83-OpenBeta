<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol-83</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f2ee;--surface:#fcfcfb;--surface-2:#f5f4f0;--line:rgba(11,11,11,.1);--line-strong:rgba(11,11,11,.2);
  --text:#0b0b0b;--text-2:#52514e;--text-3:#73726c;--track:#e6e5df;
  --codex:#2a78d6;--claude:#eb6834;--gemini:#8a5cf6;
  --good:#0ca30c;--warn:#fab219;--bad:#d03b3b;--good-ink:#006300;--warn-ink:#7a5200;--bad-ink:#b02a2a;
  --good-soft:#e8f5e8;--warn-soft:#fdf3dc;--bad-soft:#fbe9e9;
  --primary:#0b0b0b;--on-primary:#fcfcfb;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--surface-2:#222220;--line:rgba(240,239,236,.11);--line-strong:rgba(240,239,236,.24);
  --text:#f0efec;--text-2:#c3c2b7;--text-3:#96958c;--track:#2f2f2c;
  --codex:#3987e5;--claude:#d95926;--gemini:#9d7bf7;
  --good-ink:#6fd06f;--warn-ink:#f5c04f;--bad-ink:#ef8f8f;
  --good-soft:#1c2e1c;--warn-soft:#332a14;--bad-soft:#351f1f;
  --primary:#f0efec;--on-primary:#1a1a19;
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--surface-2:#222220;--line:rgba(240,239,236,.11);--line-strong:rgba(240,239,236,.24);
  --text:#f0efec;--text-2:#c3c2b7;--text-3:#96958c;--track:#2f2f2c;
  --codex:#3987e5;--claude:#d95926;--gemini:#9d7bf7;
  --good-ink:#6fd06f;--warn-ink:#f5c04f;--bad-ink:#ef8f8f;
  --good-soft:#1c2e1c;--warn-soft:#332a14;--bad-soft:#351f1f;
  --primary:#f0efec;--on-primary:#1a1a19;
}
/* Skins (spec 18): one set of variables, same functions. LIGHT and DARK above; SAKURA and TERMINAL here. */
:root[data-theme=sakura]{
  color-scheme:light;
  --bg:#fbf1f4;--surface:#fffafc;--surface-2:#f7e8ee;--line:rgba(120,60,90,.14);--line-strong:rgba(120,60,90,.28);
  --text:#3a2233;--text-2:#6b4a5e;--text-3:#86677a;--track:#f0dbe4;
  --codex:#5b7fd6;--claude:#d9667c;--gemini:#9b7ad8;
  --good:#3f9b6b;--warn:#d9a032;--bad:#c64b6a;--good-ink:#1f6b44;--warn-ink:#7a5200;--bad-ink:#a3304f;
  --good-soft:#e6f4ec;--warn-soft:#fbf0dc;--bad-soft:#fbe4ea;
  --primary:#b0587e;--on-primary:#fffafc;
}
:root[data-theme=terminal]{
  color-scheme:dark;
  --bg:#050805;--surface:#0a120a;--surface-2:#0f1a0f;--line:rgba(80,255,120,.16);--line-strong:rgba(80,255,120,.34);
  --text:#7dff9b;--text-2:#5fd17a;--text-3:#4aa862;--track:#123018;
  --codex:#53c8ff;--claude:#ffb347;--gemini:#d68cff;
  --good:#39ff6a;--warn:#ffd23f;--bad:#ff5c5c;--good-ink:#39ff6a;--warn-ink:#ffd23f;--bad-ink:#ff7b7b;
  --good-soft:#0f2a14;--warn-soft:#2a2610;--bad-soft:#2d1111;
  --primary:#39ff6a;--on-primary:#050805;
}
:root[data-theme=terminal] body,:root[data-theme=terminal] button,:root[data-theme=terminal] input,
:root[data-theme=terminal] textarea,:root[data-theme=terminal] select{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:var(--side-width,330px) minmax(0,1fr);min-height:100%}
/* The sidebar width is the user's: drag the handle on its right edge (saved in this browser). */
.side-resize{position:fixed;top:0;bottom:0;width:8px;margin-left:-4px;cursor:col-resize;z-index:5;left:var(--side-width,330px)}
.side-resize:hover,.side-resize.dragging{background:var(--line-strong)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:20px;height:100vh;position:sticky;top:0;overflow:auto}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand h1{white-space:nowrap}
.brand h1{font-size:18px;letter-spacing:-.01em}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:34px;cursor:pointer;font-weight:550;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.proj:focus-visible,.tab:focus-visible{outline:2px solid var(--codex);outline-offset:1px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{opacity:.86}
.btn.danger{color:var(--bad-ink);border-color:var(--bad)}
.btn.small{min-height:28px;padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actionbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:10px 0 14px}
.actionbar .danger-zone{margin-left:auto;display:flex;gap:8px;padding-left:12px;border-left:1px solid var(--line)}
.turn-head{display:flex;gap:10px;align-items:center;margin:14px 0 4px;padding:6px 10px;border-left:4px solid var(--line-strong);background:var(--surface-2);border-radius:6px;font-weight:650;font-size:13px}
.turn-head.codex{border-left-color:var(--codex)}.turn-head.claude{border-left-color:var(--claude)}.turn-head.gemini{border-left-color:var(--gemini)}
.turn-head .who{text-transform:uppercase;letter-spacing:.04em;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface);border:1px solid var(--line-strong)}
.share{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:6px}
.qcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--surface)}
.qcard .meta{font-size:12px;color:var(--text-3)}
.counter{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center}
.progress-box{display:flex;gap:14px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;font-size:13px}
.task-full{white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface-2);padding:10px;border-radius:8px;max-height:none}
.vcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.vcard.rec{border-color:var(--good)}
.box{border:1px dashed var(--line-strong);border-radius:8px;padding:8px 10px;margin-top:8px}
.eyebrow{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--text-3);font-size:12px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.limit{padding:10px 0;border-top:1px solid var(--line)}
.limit:first-of-type{border-top:0;padding-top:0}
.limit-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.agent{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.swatch{width:9px;height:9px;border-radius:3px;flex:none}
.swatch.claude{background:var(--claude)}.swatch.codex{background:var(--codex)}.swatch.gemini{background:var(--gemini)}
.meter-row{display:grid;grid-template-columns:76px 1fr 38px;gap:8px;align-items:center;font-size:12px;color:var(--text-2);margin-top:4px}
.meter-row .pct{text-align:right;color:var(--text);font-weight:600}
.track{height:8px;border-radius:4px;background:var(--track);position:relative;overflow:visible}
.fill{height:100%;border-radius:4px;min-width:2px}
.fill.claude{background:var(--claude)}.fill.codex{background:var(--codex)}
.tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);border-radius:1px;box-shadow:0 0 0 1px var(--surface)}
.limit-foot{font-size:12px;color:var(--text-3);margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pill svg{width:12px;height:12px;flex:none}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.idle{background:var(--surface-2);color:var(--text-2)}
.pill.run{background:var(--surface-2);color:var(--text)}
.projects{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.proj{display:block;text-decoration:none;padding:8px;border-radius:8px}
.proj:hover{background:var(--surface-2)}
.proj[aria-current=true]{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--text)}
.proj-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.proj-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-ver{font-size:12px;color:var(--text-3);flex:none}
.proj-sub{font-size:12px;color:var(--text-2);display:flex;gap:6px;align-items:center;margin-top:2px;min-width:0}
.proj-sub span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--text-3)}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.dot.run{background:var(--codex);animation:pulse 1.6s ease-in-out infinite}
.dot.claude{background:var(--claude)}.dot.codex{background:var(--codex)}.dot.gemini{background:var(--gemini)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}
main{padding:26px 30px 48px;min-width:0}
.wrap{max-width:1180px;margin:0 auto}
.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.head h2{font-size:23px;letter-spacing:-.015em;line-height:1.25;overflow-wrap:anywhere}
.activity{margin-top:5px;color:var(--text-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.alert{border-radius:10px;padding:10px 14px;margin-bottom:16px;background:var(--bad-soft);color:var(--bad-ink);font-weight:500;overflow-wrap:anywhere}
.alert.warn{background:var(--warn-soft);color:var(--warn-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.test-card{margin-bottom:18px}
.test-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.vnum{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.test-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px;color:var(--text-2);font-size:13px}
.test-body{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.steps{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.path{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-2);overflow-wrap:anywhere}
.wip{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line-strong);color:var(--text-2);font-size:13px}
.wip strong{color:var(--text)}
.columns{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.rail{display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tab{appearance:none;background:none;border:0;padding:7px 11px;cursor:pointer;color:var(--text-2);font-weight:550;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--text)}
.event{display:grid;grid-template-columns:50px 12px minmax(0,1fr);gap:8px;padding:6px 0;align-items:baseline}
.event time{font-size:12px;color:var(--text-3)}
.event .dot{align-self:center}
.event.major{background:var(--surface-2);border-radius:8px;padding:8px;margin:4px -8px;grid-template-columns:50px 12px minmax(0,1fr)}
.event b{font-weight:600}
.event summary{cursor:pointer}
.event .body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--surface-2);color:var(--text-2);font-weight:400;max-height:460px;overflow:auto}
.event.major .body{background:var(--surface)}
.final-card{margin-bottom:18px;border-color:var(--good)}
.signal{border-radius:10px;padding:10px 14px;margin-bottom:16px;background:var(--warn-soft);color:var(--warn-ink)}
.signal b{display:block;margin-bottom:4px}
.signal li{margin-left:16px}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 12px;font-size:13px}
.stats dt{color:var(--text-3)}.stats dd{margin:0;text-align:right;font-weight:600}
table.plan{width:100%;border-collapse:collapse;font-size:13px}
table.plan th{text-align:left;color:var(--text-3);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line)}
table.plan td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.plan .num{text-align:right;white-space:nowrap}
table.plan tr.done td{color:var(--text-3)}
.help{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--surface-2);color:var(--text-2);font-size:13px}
.asset{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.asset:first-child{border-top:0}
.asset img{width:110px;height:110px;object-fit:contain;border-radius:8px;background:var(--surface-2)}
.asset .thumb{width:110px;height:110px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;text-align:center;padding:6px}
.live{max-height:58vh;overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.live-row{display:grid;grid-template-columns:62px 18px minmax(0,1fr);gap:6px;padding:3px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.live-row time{color:var(--text-3)}.live-row.thinking{color:var(--text-3);font-style:italic}.live-row.text{color:var(--text)}
.thread{margin-top:12px;display:flex;flex-direction:column;gap:12px;max-height:62vh;overflow:auto}
.msg{border-top:1px solid var(--line);padding-top:10px}.msg:first-child{border-top:0;padding-top:0}
.msg .q{font-weight:600;overflow-wrap:anywhere}.msg .a{white-space:pre-wrap;color:var(--text-2);overflow-wrap:anywhere;margin-top:2px}
.final-card .body{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto}
.empty{color:var(--text-3);padding:10px 0}
.ver{padding:11px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:start}
.ver:first-child{border-top:0;padding-top:0}
.ver .n{font-weight:700;font-size:16px}
.ver-sub{color:var(--text-2);font-size:13px;overflow-wrap:anywhere}
.ver-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
pre.transcript{margin:0;max-height:62vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-2)}
.task{white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px 12px;font-size:13px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.kv dt{color:var(--text-3)}.kv dd{margin:0;overflow-wrap:anywhere}
.card h3{font-size:14px;margin-bottom:8px}
textarea,input[type=text],input[type=number]{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;min-height:34px}
textarea{resize:vertical;display:block}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--text-2)}
.qa{margin-top:12px;display:flex;flex-direction:column;gap:12px;max-height:380px;overflow:auto}
.qa .q{font-weight:600;overflow-wrap:anywhere}
.qa .a{white-space:pre-wrap;color:var(--text-2);overflow-wrap:anywhere;margin-top:2px}
.who{font-size:12px;color:var(--text-3);margin-top:2px}
.note{padding:8px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.note:first-child{border-top:0}
.notes{margin-top:10px;max-height:260px;overflow:auto}
.form{max-width:760px}
.form h2{font-size:23px;letter-spacing:-.015em;margin-bottom:4px}
.lead{color:var(--text-2);margin-bottom:18px}
.field{margin-bottom:14px}
.field label,.label{display:block;font-weight:600;margin-bottom:4px}
.hint{font-size:13px;color:var(--text-3);margin-top:3px}
#task{min-height:230px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
#task.drag{outline:2px dashed var(--codex)}
details summary{cursor:pointer;color:var(--text-2);font-weight:550}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.error{color:var(--bad-ink);font-weight:500;margin-top:8px}
dialog{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--text);padding:18px;width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
.hero{max-width:560px;margin:12vh auto 0;text-align:center}
.hero h2{font-size:23px;margin-bottom:6px}
.hero p{color:var(--text-2);margin-bottom:16px}
.power{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;align-items:center;cursor:pointer}
.power b{font-weight:650}
.power .hint{grid-column:1/-1;margin:0}
.power.on{border-color:var(--warn);background:var(--warn-soft)}
.power.on .hint{color:var(--warn-ink)}
.models{display:grid;gap:12px}
.form .models{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:4px}
.pair label{display:block;font-size:12px;color:var(--text-3);font-weight:500;margin:0}
select{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:5px 7px;min-height:32px;margin-top:2px}
select:focus-visible{outline:2px solid var(--codex);outline-offset:1px}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.lang button{appearance:none;border:0;background:none;padding:4px 8px;font-size:12px;font-weight:600;color:var(--text-3);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.brand-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.brand-tools .btn,.brand-tools select{white-space:nowrap}
#skin-pick{max-width:110px}
.gh-row{display:flex;gap:10px;margin:8px 0}
.gh-row label{display:inline-flex;gap:5px;align-items:center;font-size:13px}
.gh-link{font-weight:600;overflow-wrap:anywhere}
.command{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border-radius:6px;padding:4px 8px;display:inline-block;margin-top:4px}
.thresholds{margin-top:6px;font-size:13px}
.thresholds .grid2{margin-top:6px}
@media (max-width:1080px){.columns{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side-resize{display:none}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:18px 16px 40px}
  .grid2{grid-template-columns:1fr}
  .ver{grid-template-columns:38px minmax(0,1fr)}
  .ver-actions{grid-column:1/-1;justify-content:flex-start}
}
</style>
</head>
<body>
<div class="app">
  <div class="side-resize" id="side-resize" role="separator" aria-orientation="vertical" aria-label="Szerokość panelu" tabindex="0"></div>
  <aside class="side">
    <div class="brand"><h1>Sol-83</h1><div class="brand-tools">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="pl" aria-pressed="true">PL</button><button data-lang="en" aria-pressed="false">EN</button>
      </div>
      <select id="skin-pick" aria-label="Skin" class="small"><option value="light">LIGHT</option><option value="dark">DARK</option><option value="sakura">SAKURA</option><option value="terminal">TERMINAL</option><option value="">AUTO</option></select>
      <a class="btn primary small" href="#/nowy" data-t="newProject"></a></div></div>
    <section>
      <div class="eyebrow"><span data-t="limits"></span><button class="linkbtn" id="refresh" data-t="refresh"></button></div>
      <div id="limits"></div>
      <details class="thresholds" id="security-box"><summary data-t="securityTitle"></summary>
        <p class="hint" id="sandbox-state"></p>
        <label class="check"><input type="checkbox" id="sec-network"> <span data-t="secNetwork"></span></label>
        <label class="check"><input type="checkbox" id="sec-unsandboxed"> <span data-t="secUnsandboxed"></span></label>
      </details>
      <details class="thresholds" id="providers-box"><summary data-t="accounts"></summary>
        <div id="providers"></div>
        <button class="btn small" id="check-providers" data-t="checkConnection"></button>
        <p class="hint" data-t="checkHint"></p>
      </details>
      <details class="thresholds">
        <summary data-t="handoffAt"></summary>
        <div class="grid2">
          <div><label for="th-claude"><span>Claude · </span><span data-t="window5"></span> (%)</label><input id="th-claude" type="number" min="50" max="100"></div>
          <div><label for="wk-claude"><span>Claude · </span><span data-t="week"></span> (%)</label><input id="wk-claude" type="number" min="50" max="100"></div>
          <div><label for="th-codex"><span>Codex · </span><span data-t="window5"></span> (%)</label><input id="th-codex" type="number" min="50" max="100"></div>
          <div><label for="wk-codex"><span>Codex · </span><span data-t="week"></span> (%)</label><input id="wk-codex" type="number" min="50" max="100"></div>
        </div>
        <p class="hint" data-t="thresholdHint"></p>
      </details>
      <label class="power" id="power"><input type="checkbox" id="full-power"><b>Full Power</b>
        <span class="hint" id="power-hint"></span></label>
    </section>
    <section>
      <div class="eyebrow"><span data-t="projects"></span></div>
      <nav class="projects" id="projects"></nav>
    </section>
    <section id="repos-section" hidden>
      <div class="eyebrow"><span data-t="ghRepos"></span></div>
      <input id="repo-filter" type="text" data-t-placeholder="ghFilter" style="margin-bottom:6px">
      <nav class="projects" id="repos"></nav>
    </section>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>

<dialog id="reject">
  <form method="dialog">
    <h3 id="reject-title" style="margin-bottom:6px"></h3>
    <p class="hint" style="margin-bottom:10px" data-t="rejectHint"></p>
    <textarea id="reject-text" rows="5" data-t-placeholder="rejectPlaceholder"></textarea>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" value="cancel" data-t="cancel"></button>
      <button class="btn primary" value="send" data-t="sendBack"></button>
    </div>
  </form>
</dialog>

<dialog id="power-dialog">
  <form method="dialog">
    <h3 style="margin-bottom:8px" data-t="powerTitle"></h3>
    <div class="alert warn"><b data-t="powerWarn"></b></div>
    <p style="margin-bottom:8px" data-t="powerOne"></p>
    <p style="margin-bottom:8px" data-t="powerTwo"></p>
    <p class="hint" data-t="powerThree"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" value="cancel" data-t="cancel"></button>
      <button class="btn danger" value="on" data-t="powerConfirm"></button>
    </div>
  </form>
</dialog>

<dialog id="delete-dialog">
  <form method="dialog">
    <h3 style="margin-bottom:8px" id="delete-title"></h3>
    <div class="alert"><b data-t="deleteWarn"></b></div>
    <p style="margin-bottom:8px" data-t="deleteWhat"></p>
    <p style="margin-bottom:8px" id="delete-repo"></p>
    <p class="hint" data-t="deleteKeeps"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" value="cancel" data-t="cancel"></button>
      <button class="btn danger" value="delete" data-t="deleteConfirm"></button>
    </div>
  </form>
</dialog>

<dialog id="public-dialog">
  <form method="dialog">
    <h3 style="margin-bottom:8px" data-t="publicTitle"></h3>
    <div class="alert warn"><b data-t="publicWarn"></b></div>
    <p style="margin-bottom:8px" data-t="publicOne"></p>
    <p class="hint" data-t="publicTwo"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" value="cancel" data-t="cancel"></button>
      <button class="btn danger" value="on" data-t="publicConfirm"></button>
    </div>
  </form>
</dialog>

  document.getElementById('file').addEventListener('change', e => load(e.target.files[0]));
  task.addEventListener('dragover', e => { e.preventDefault(); task.classList.add('drag'); });
  task.addEventListener('dragleave', () => task.classList.remove('drag'));
  task.addEventListener('drop', e => { e.preventDefault(); task.classList.remove('drag'); load(e.dataTransfer.files[0]); });
  document.getElementById('new').addEventListener('submit', async e => {
    e.preventDefault();
    const value = id => document.getElementById(id).value;
    const pick = (side, kind) => kind === 'role'
      ? [...document.querySelectorAll(`#form-models .roles-pick[data-side=${side}] input:checked`)].map(i => i.value).join(',') || 'general'
      : document.querySelector(`#form-models [data-side=${side}][data-kind=${kind}]`).value;
    try{
      const {id} = await withTopConfirm('/api/projects', {task:value('task'), lang:state.lang,
        claude_selection:pick('claude','selection'), codex_selection:pick('codex','selection'), gemini_selection:document.querySelector('#form-models [data-side=gemini][data-kind=selection]')?.value || 'manual', title:value('title'), verify_cmd:value('verify'), repo_path:repo ? '' : value('repo'), github_repo:repo,
        max_turns:Number(value('turns')), claude_model:pick('claude','model'), claude_reasoning:pick('claude','reasoning'),
        codex_model:pick('codex','model'), codex_reasoning:pick('codex','reasoning'),
        claude_role:pick('claude','role'), codex_role:pick('codex','role'), role_fallback:pick('team','fallback'),
        gemini_model:pick('gemini','model'), gemini_reasoning:pick('gemini','reasoning'), gemini_role:pick('gemini','role')});
      location.hash = '#/p/'+id;
    }catch(error){ document.getElementById('form-error').textContent = error.message; }
  });
}
async function refreshTranscript(id){
  const {text} = await api(`/api/projects/${id}/transcript`);
  state.transcript = text;
  if(state.tab === 'transkrypt' && state.detail) renderTab(state.detail);
}
function renderPower(on){
  document.getElementById('full-power').checked = on;
  document.getElementById('power').classList.toggle('on', on);
  document.getElementById('power-hint').textContent = t(on?'powerOn':'powerOff');
}
async function poll(){
  try{
    state.overview = await api('/api/overview');
    renderLimits(state.overview.limits);
    renderPower(state.overview.full_power);
    renderSecurity(state.overview.security);
    renderProjects(state.overview.projects);
    renderRepos();
    const id = route();
    if(id && id !== 'new'){
      state.detail = await api('/api/projects/'+id);
      renderDetail();
    }
  }catch(error){ console.error(error); }
}
function navigate(){
  const id = route();
  state.detail = null; state.transcript = '';
  if(id === 'new') renderForm();
  else if(id) shell();
  else renderHero();
  poll();
}
async function withSecretsCheck(path, body){
  try{ return await api(path, body); }
  catch(error){
    const found = error.data?.secrets;
    if(!found || !confirm(t('secretsConfirm', found.map(item => '- ' + item).join('\n')))) throw error;
    return await api(path, {...body, confirmed_secrets:error.data.secrets_token});
  }
}
async function publish(n, visibility){
  const name = document.getElementById('gh-name')?.value || '';
  await withSecretsCheck(`/api/projects/${route()}/github`, {number:n, name, visibility});
  state.ghKey = null; await poll();
}
document.addEventListener('click', async e => {
  const language = e.target.closest('[data-lang]');
  if(language){
    state.lang = language.dataset.lang;
    try{ localStorage.setItem('gemini-lang', state.lang); }catch(error){}
    state.html = {}; state.ghKey = null;
    applyStatic(); navigate();
    return;
  }
  const tab = e.target.closest('[data-tab]');
  if(tab){
    state.tab = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(item => item.setAttribute('aria-selected', item === tab));
    state.html['tab-body'] = null;
    if(state.detail) renderTab(state.detail);
    return;
  }
  const button = e.target.closest('[data-act]');
  if(!button) return;
  const id = route(), n = Number(button.dataset.n), act = button.dataset.act;
  if(act === 'item'){
    button.disabled = true;
    try{ await api(`/api/projects/${id}/start-item`, {item:button.dataset.item, request_key:requestKey()}); await poll(); }
    catch(error){ alert(error.message); button.disabled = false; }
    return;
  }
  if(act === 'setup-approve'){
    button.disabled = true;
    try{ await api(`/api/projects/${id}/setup-approve`, {sha:button.dataset.sha}); delete state.html['tab-body']; state.renderedTab = null; await poll(); }
    catch(error){ alert(error.message); button.disabled = false; }
    return;
  }
  if(act === 'delete-project'){
    const d = state.detail, p = d.project;
    document.getElementById('delete-title').textContent = t('deleteAsk', p.title);
    document.getElementById('delete-repo').textContent = !p.repo_path ? '' : d.own_repo ? t('deleteOwn', p.repo_path) : t('deleteUser', p.repo_path, p.branch || '');
    document.getElementById('delete-dialog').showModal();
    return;
  }
  if(act === 'withdraw'){
    button.disabled = true;
    try{ await api(`/api/projects/${id}/withdraw`, {question:Number(button.dataset.q)}); await poll(); }
    catch(error){ alert(error.message); button.disabled = false; }
    return;
  }
  if(act === 'order'){
    const q = state.detail.questions.find(x => x.id === Number(button.dataset.q));
    button.disabled = true;
    try{ await api(`/api/projects/${id}/notes`, {text:q.question, order:true, request_key:'order-q' + q.id}); await poll(); }
    catch(error){ alert(error.message); button.disabled = false; }
    return;
  }
  if(act === 'broken'){
    state.rejecting = n;
    document.getElementById('reject-title').textContent = t('rejectTitle', n);
    document.getElementById('reject-text').value = '';
    document.getElementById('reject').showModal();
    return;
  }
  if(act === 'gh-send' || (act === 'gh-visibility' && button.dataset.to === 'public')){
    const chosen = document.querySelector('input[name=gh-vis]:checked')?.value;
    const goingPublic = act === 'gh-visibility' || chosen === 'public' || (!chosen && state.detail?.project.github_visibility === 'public');
    state.pendingPublic = {act, n};
    if(goingPublic){ document.getElementById('public-dialog').showModal(); return; }
    return runGitHub(button, 'private');
  }
  if(act === 'tab-questions'){
    state.tab = 'pytania'; document.querySelectorAll('.tab').forEach(item => item.setAttribute('aria-selected', item.dataset.tab === 'pytania'));
    state.html['tab-body'] = null; renderTab(state.detail); return;
  }
  if(act === 'copy'){
    try{ await navigator.clipboard.writeText(button.dataset.text); button.textContent = t('copied'); }catch(error){ alert(button.dataset.text); }
    return;
  }
  if(act === 'answer' || act === 'test-result'){
    const q = Number(button.dataset.q), own = document.getElementById('answer-'+q);
    const body = {interaction:q, request_key:requestKey()};
    if(act === 'test-result'){ body.result = button.dataset.result; body.comment = prompt(t('testComment')) || ''; }
    else { body.value = button.dataset.value || own?.value || ''; if(!body.value.trim()) return; }
    button.disabled = true;
    try{ await api(`/api/projects/${id}/answer`, body); await poll(); }catch(error){ alert(error.message); button.disabled = false; }
    return;
  }
  const extra = {
    'run-app':['run',{number:n}], 'run-stop':['run-stop',{}], reveal:['reveal',{path:button.dataset.path}],
    'q-state':['interaction-state',{interaction:Number(button.dataset.q), state:button.dataset.state}],
    'asset-decision':['asset-decision',{id:button.dataset.id, decision:button.dataset.decision}],
    'git-deliver':['git-deliver',{request_key:requestKey()}]
  };
  if(extra[act]){
    button.disabled = true;
    try{ await api(`/api/projects/${id}/${extra[act][0]}`, extra[act][1]); await poll(); }catch(error){ alert(error.message); }
    button.disabled = false;
    return;
  }
  const calls = {
    stop:['stop',{}], 'stop-now':['stop',{immediate:true}], resume:['resume',{}], accept:['accept',{}],
    works:['verdict',{number:n,works:true}], 'test-copy':['test-copy',{number:n}], 'gh-visibility':['github-visibility',{visibility:'private'}]
  };
  button.disabled = true;
  try{ await api(`/api/projects/${id}/${calls[act][0]}`, calls[act][1]); state.ghKey = null; await poll(); }
  catch(error){ alert(error.message); button.disabled = false; }
});
async function runGitHub(button, visibility){
  const {act, n} = state.pendingPublic;
  if(button) button.disabled = true;
  try{
    if(act === 'gh-send') await publish(n, visibility);
    else { await withSecretsCheck(`/api/projects/${route()}/github-visibility`, {visibility}); state.ghKey = null; await poll(); }
  }catch(error){ alert(error.message); if(button) button.disabled = false; }
}
document.getElementById('repo-filter').addEventListener('input', renderRepos);
document.getElementById('providers-box').addEventListener('toggle', async e => {
  if(e.target.open && !state.providers){ try{ state.providers = await api('/api/providers'); renderProviders(state.providers); }catch(error){} }
});
for(const [id, key] of [['sec-network','test_network'],['sec-unsandboxed','allow_unsandboxed']]){
  document.getElementById(id).addEventListener('change', async e => {
    if(key === 'allow_unsandboxed' && e.target.checked && !confirm(t('secUnsandboxedWarn'))){ e.target.checked = false; return; }
    try{ await api('/api/settings', {[key]:e.target.checked}); }catch(error){ alert(error.message); }
  });
}
function renderSecurity(s){
  if(!s) return;
  const net = document.getElementById('sec-network'), raw = document.getElementById('sec-unsandboxed');
  if(document.activeElement !== net) net.checked = s.test_network;
  if(document.activeElement !== raw) raw.checked = s.allow_unsandboxed;
  document.getElementById('sandbox-state').textContent = s.sandbox ? t('sandboxOn', s.sandbox) : t('sandboxOff');
}
document.getElementById('check-providers').addEventListener('click', async e => {
  e.target.disabled = true;
  try{ const r = await api('/api/providers/check', {}); state.providers = r.providers; renderProviders(r.providers); renderLimits(r.limits); }
  catch(error){ alert(error.message); }
  e.target.disabled = false;
});
document.addEventListener('toggle', async e => {
  const id = Number(e.target.dataset?.event);
  if(!id) return;
  if(!e.target.open){ state.open.delete(id); return; }
  state.open.add(id);
  if(state.bodies[id] === undefined){
    const {body} = await api(`/api/projects/${route()}/events/${id}`);
    state.bodies[id] = body || '';
    if(state.detail) renderTab(state.detail);
  }
}, true);
document.addEventListener('change', async e => {
  const rolesBox = e.target.closest('.roles-pick');
  if(rolesBox){
    if(!rolesBox.closest('#models')) return;
    const side = rolesBox.dataset.side, roles = [...rolesBox.querySelectorAll('input:checked')].map(i => i.value).join(',') || 'general';
    try{ await api(`/api/projects/${route()}/models`, {[side+'_role']:roles}); }catch(error){ alert(error.message); }
    delete state.html['models']; poll();
    return;
  }
  if(e.target.id === 'skin-pick'){ applySkin(e.target.value); return; }
  if(e.target.id === 'lang-pick'){
    try{ await api(`/api/projects/${route()}/language`, {language:e.target.value}); }catch(error){ alert(error.message); }
    poll(); return;
  }
  if(e.target.id === 'coordinator-pick'){
    try{ await api('/api/settings', {coordinator:e.target.value}); }catch(error){ alert(error.message); }
    delete state.html['coordinator']; poll();
    return;
  }
  if(e.target.id === 'gh-auto'){
    await api(`/api/projects/${route()}/github-auto`, {enabled:e.target.checked});
    state.ghKey = null; poll();
    return;
  }
  const select = e.target.closest('select[data-side]');
  if(!select) return;
  const side = select.dataset.side, box = select.closest('.side-pick');
  if(select.dataset.kind === 'selection'){
    if(!select.closest('#models')) return;
    try{ await api(`/api/projects/${route()}/models`, {[side+'_selection']:select.value}); }
    catch(error){ alert(error.message); }
    delete state.html['models']; poll();
    return;
  }
  if(['role','fallback'].includes(select.dataset.kind)){
    if(!select.closest('#models')) return;
    try{ await api(`/api/projects/${route()}/models`, {[select.dataset.kind === 'role' ? side+'_role' : 'role_fallback']:select.value}); }
    catch(error){ alert(error.message); delete state.html['models']; }
    poll();
    return;
  }
  const reasoning = box.querySelector('[data-kind=reasoning]');
  if(select.dataset.kind === 'model'){
    const efforts = state.catalog?.[side]?.find(m => m.id === select.value)?.efforts || [];
    const next = efforts.includes(reasoning.value) ? reasoning.value : efforts.includes('high') ? 'high' : efforts.at(-1);
    const fixed = select.value !== 'none' && state.catalog?.[side]?.find(m => m.id === select.value)?.efforts?.length === 0;
    reasoning.disabled = select.value === 'none' || fixed;
    reasoning.innerHTML = select.value === 'none' ? '' : fixed ? `<option value="">${esc(t('inModel'))}</option>` : effortOptions(side, select.value, next);
  }
  if(select.closest('#models')){
    try{ await withTopConfirm(`/api/projects/${route()}/models`, {[side+'_model']:box.querySelector('[data-kind=model]').value, [side+'_reasoning']:reasoning.value}); }
    catch(error){ alert(error.message); }
    delete state.html['models']; poll();
  }
});
document.addEventListener('submit', async e => {
  if(e.target.id === 'rename-form'){
    e.preventDefault();
    try{ await api(`/api/projects/${route()}/rename`, {title:document.getElementById('rename-text').value}); poll(); }catch(error){ alert(error.message); }
    return;
  }
  if(e.target.id === 'license-form'){
    e.preventDefault();
    const v = id => document.getElementById(id);
    try{ await api(`/api/projects/${route()}/license`, {kind:v('lic-kind').value, spdx:v('lic-spdx').value, holder:v('lic-holder').value, custom:v('lic-custom').value, overwrite:v('lic-overwrite').checked}); state.renderedTab = null; poll(); }
    catch(error){ alert(error.message); }
    return;
  }
  if(e.target.id === 'git-form'){
    e.preventDefault();
    const v = id => document.getElementById(id);
    try{ await api(`/api/projects/${route()}/git-context`, {remote:v('git-remote').value, base_branch:v('git-base').value, strategy:v('git-strategy').value, allow_push:v('git-push').checked, allow_pr:v('git-pr').checked}); state.renderedTab = null; poll(); }
    catch(error){ alert(error.message); }
    return;
  }
  if(e.target.id === 'verify-form'){
    e.preventDefault();
    try{ await api(`/api/projects/${route()}/verify`, {command:document.getElementById('verify-cmd').value}); poll(); }
    catch(error){ alert(error.message); }
    return;
  }
  if(e.target.id === 'asset-form'){
    e.preventDefault();
    const value = id => document.getElementById(id).value;
    try{
      await api(`/api/projects/${route()}/asset`, {type:value('asset-type'), prompt:value('asset-prompt'), path:value('asset-path'), size:value('asset-size'), style:value('asset-style')});
      e.target.reset(); poll();
    }catch(error){ alert(error.message); }
    return;
  }
  if(e.target.id === 'msg'){
    e.preventDefault();
    const input = document.getElementById('msg-text'), interrupt = document.getElementById('msg-interrupt');
    if(!input.value.trim()) return;
    const text = input.value; input.value = '';
    try{ await api(`/api/projects/${route()}/message`, {text, interrupt:interrupt.checked, lang:state.lang}); }
    catch(error){ alert(error.message); input.value = text; }
    interrupt.checked = false; poll();
  }
  if(e.target.id === 'ask'){
    e.preventDefault();
    const input = document.getElementById('ask-text');
    if(!input.value.trim()) return;
    const question = input.value; input.value = '';
    await api(`/api/projects/${route()}/ask`, {question, lang:state.lang}); poll();
  }
  if(e.target.id === 'note'){
    e.preventDefault();
    const input = document.getElementById('note-text'), urgent = document.getElementById('note-urgent');
    if(!input.value.trim()) return;
    const text = input.value; input.value = '';
    // The same key until the server confirms: a retry after a lost answer cannot add the note twice.
    state.noteKey = state.noteKey || requestKey();
    try{ await api(`/api/projects/${route()}/notes`, {text, urgent:urgent.checked, request_key:state.noteKey}); state.noteKey = null; urgent.checked = false; }
    catch(error){ input.value = text; alert(error.message); }
    poll();
  }
});
document.getElementById('reject').addEventListener('close', async e => {
  if(e.target.returnValue !== 'send') return;
  await api(`/api/projects/${route()}/verdict`, {number:state.rejecting, works:false, comment:document.getElementById('reject-text').value, request_key:requestKey()});
  poll();
});
document.getElementById('delete-dialog').addEventListener('close', async e => {
  if(e.target.returnValue !== 'delete') return;
  try{ await api(`/api/projects/${route()}/delete`, {}); location.hash = '#/'; }
  catch(error){ alert(error.message); }
});
document.getElementById('public-dialog').addEventListener('close', e => {
  if(e.target.returnValue === 'on') runGitHub(null, 'public');
});
document.getElementById('refresh').addEventListener('click', async () => {
  const {limits} = await api('/api/limits/refresh', {}); renderLimits(limits);
});
for(const name of ['claude','codex']){
  for(const [prefix, key] of [['th-','threshold_'],['wk-','weekly_']]){
    document.getElementById(prefix+name).addEventListener('change', async e => {
      const {limits} = await api('/api/settings', {[key+name]:Number(e.target.value)}); renderLimits(limits);
    });
  }
}
async function setPower(on){ await api('/api/settings', {full_power:on}); poll(); }
document.getElementById('full-power').addEventListener('click', e => {
  if(e.target.checked){ e.preventDefault(); document.getElementById('power-dialog').showModal(); }
  else setPower(false);
});
document.getElementById('power-dialog').addEventListener('close', e => {
  if(e.target.returnValue === 'on') setPower(true);
});
window.addEventListener('hashchange', navigate);
applyStatic();
Promise.all([api('/api/catalog'), api('/api/github')]).then(([catalog, github]) => { state.catalog = catalog; state.github = github; navigate(); }).catch(navigate);
setInterval(poll, 3000);
const refreshGitHub = () => Promise.all([api('/api/github'), api('/api/github/repos')])
  .then(([github, {repos}]) => { state.github = github; state.repos = repos; }).catch(() => {});
refreshGitHub();
setInterval(refreshGitHub, 60000);
</script>
</body>
